name: Unit Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: 授予 gradlew 执行权限
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: 使用 Gradle 测试（非 Windows）
        if: runner.os != 'Windows'
        run: ./gradlew test
      - name: 使用 Gradle 测试（Windows）
        if: runner.os == 'Windows'
        run: .\gradlew.bat test
      - name: 检查测试后工作区是否干净
        run: git diff --exit-code
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/test-results
